# 让 MoveIt 通过 action 调 Gazebo 里那个 joint_trajectory_controller。
# 注意：joint_trajectory_controller 动作接口的名字由 controller_manager 按
# <控制器名>/follow_joint_trajectory 生成。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
