# 物品清单的简化碰撞模型模板。
#
# 用法：复制成同目录的 track1_items.yaml，再按自己的清单填 items。脚本默认读
# track1_items.yaml；本仓库不附带任何真实物品清单。
#
# 用途：把这些物品作为 MoveIt 规划场景里的碰撞体，用来检查"给定物品的抓取
# 位姿，机械臂能不能规划出无碰撞的轨迹"，以及工作空间/桌面布局是否合理。
# 注意：这里不是高精度模型，只有包围尺寸；抓取本身（爪指干涉、摩擦）不在
# 当前仿真的能力范围内。
#
# 尺寸单位：米。shape/size 约定：
#   box       size = [x, y, z]   三个方向的完整边长
#   cylinder  size = [直径, 高度]（轴向沿 z）
#   sphere    size = [直径]
#
# source 字段说明数据可信度，正式规划前必须按实物核对：
#   实测     = 卡尺量过
#   估计     = 按常见商品尺寸估的，误差可能较大
#   待实测   = 没有可靠数据，先用占位值，务必替换

frame_id: base_link

# 桌子：桌面 1.00 x 0.34 m，板厚 0.04 m，桌面位于 z = 0.30 m（近边 y=0.26，
# 远边 y=0.60）。这个尺寸是按实测工作空间定的，两条硬约束：
#   1. 近边不能比 y≈0.22 更靠里——大臂（link2）在零位时最远伸到 y≈0.21 m，
#      再往里桌子就会和大臂相交，机器人一直处于自身碰撞状态，IK/规划全失败；
#   2. 远边不能超过 y≈0.55——S3-60 的法兰（link6）够不到更远的地方，
#      详见 docs/workspace_map_z035.md。
table:
  size: [1.00, 0.34, 0.04]
  top_z: 0.30
  center_xy: [0.0, 0.43]

# 摆放：每个 Subset 最多 columns x rows 件，列距 0.16 m、行距 0.20 m。
# 实测教训：列距小于物品自身宽度时，物品的碰撞体会互相挤住，手伸不进去，
# 可达率反而下降；间距拉开又超出臂展。所以真做抓取演练时建议一次只摆 5 件
# （一排，间距 >=0.18 m），10 件只是为了一次性把可达性都测出来。
layout:
  columns: 5
  rows: 2
  x_start: -0.32
  x_step: 0.16
  y_start: 0.33
  y_step: 0.20

# 物品按 subset 分组（1~4，每组不超过 columns x rows 件），例如：
#   - id: 1
#     subset: 1
#     name_en: example-box
#     name_cn: 示例盒子
#     shape: box
#     size: [0.10, 0.08, 0.06]
#     mass: 0.2
#     source: 估计
#     link: https://example.com/   # 可选：商品页链接，方便核对尺寸
items: []
