# KDL is only the first offline IK baseline.  It is a local numerical solver,
# so keep multiple attempts for wrist-heavy grasp orientations.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 20
# Closed-loop tool-point IK.  The chain includes the fixed gripper body and
# grasp_tcp; finger branches remain governed by the separate gripper group.
arm_with_tool:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 20
