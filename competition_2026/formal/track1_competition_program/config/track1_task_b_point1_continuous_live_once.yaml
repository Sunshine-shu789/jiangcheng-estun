# Task B point-1 single-round LIVE configuration.
# Scope: one operator-authorized continuous trajectory pick/return at point 1.
# The arm starts at the shared initial pose, moves to point-1 observation,
# requires fresh banana vision confirmation, performs the in-place pick/return,
# returns all six axes to the shared initial pose, and then exits.
# No point 2-5 cycle, operator pause, or automatic retry.
task:
  mode: B
  max_picks: 1
  stop_on_error: true
  sample_period_s: 0.2
vision:
  backend: realsense_yolo
  weights: ../models/best.pt
  min_confidence: 0.35
  require_depth: true
  camera_frame_id: camera_color_optical_frame
  width: 640
  height: 480
  fps: 15
  serial: ''
  warmup_frames: 20
  imgsz: 960
  device: 0
  depth_window: 5
  target_class: 8-Plastic_Banana
  classes:
  - 1-Cheez-it
  - 2-Starkist_Tuna
  - 3-Scissors
  - 4-Frenchs_Mustard
  - 5-Tomato_Soup
  - 6-Foam_Brick
  - 7-Clamp
  - 8-Plastic_Banana
  - 9-Mug
  - 10-meat_can
  anchor: top_center
  rotate_180: true
  output_dir: ../logs/vision
  continuous: true
  show: true
  window_name: Track 1 - D405 + YOLO
  preview_fps: 30
  capture_timeout_s: 20.0
  stale_after_s: 2.0
  stabilizer:
    enabled: true
    inference_min_confidence: 0.1
    confirm_hits: 3
    max_misses: 3
    match_iou: 0.2
    confidence_alpha: 0.25
    box_alpha: 0.55
    depth_alpha: 0.25
    duplicate_iou: 0.55
    containment_ratio: 0.9
    cross_class_iou: 0.4
    cross_class_containment: 0.6
    cross_class_conf_ratio: 1.5
    max_per_class: 1
    class_switch_hits: 3
    edge_margin_px: 8
    edge_suppress_confidence: 0.55
  save_annotated: false
  save_interval_s: 2.0
task_a:
  iou_threshold: 0.75
  ground_truth_file: ''
  output_dir: ../logs/task_a_annotated
  save_annotated: true
  draw_labels: true
  draw_ground_truth: true
  max_frames: 0
  min_positions: 10
  patrol:
    enabled: true
    position_count: 10
    min_move_distance_m: 0.15
    stride_m: 0.2
    linear_step_m: 0.01
    settle_s: 0.8
    axes:
    - x
    - y
task_b:
  initial_pose_file: task_b_initial_pose_20261019_233355.yaml
  initial_pose_tolerance_deg: 0.5
  place_poses_file: task_b_place_poses_20261020.yaml
  rounds: 1
  return_to_pick: true
  target_class: 8-Plastic_Banana
  keep_same_target: true
  pick_pose_tolerance_m: 0.08
  point_assignment_margin_m: 0.01
  next_point_timeout_s: 0.0
  next_point_poll_s: 0.5
  lift_hold_s: 2.0
  operator_pause_after_each_pick: false
  place_names:
  - pick_1
  point_grasp_z_m:
  - 0.166534092
  point_grasp_xy_from_observation:
  - false
  point_grasp_xy_m:
  - null
  point_grasp_rpy:
