# Task B pick_1 single-point fast supervised live test (2026-11-06).
# Execution requires a new explicit physical-motion authorization.
#
# Derived from:
#   config/track1_task_b_five_point_adaptive_safe_20261102.yaml
#
# Scope and fail-closed behavior:
#   - exactly one pick_1 attempt; no automatic retry;
#   - no pick_2 through pick_5 and no five-point sequence;
#   - start by moving to the shared Task B initial six-joint pose;
#   - move to the taught pick_1 observation pose and require fresh banana vision;
#   - use one fresh same-frame PCA centre and close across its short axis;
#   - emit exactly one candidate, with no taught-orientation rescue branches;
#   - retain full route/IK, joint-limit, step, acceleration,
#     branch-continuity and Jacobian gates;
#   - perform in-place release, retreat, and return to the initial pose;
#   - main motion speed: 0.06 m/s Cartesian, 0.6 rad/s joints;
#   - hardware gripper: 10 rad/s, 12 s arrival timeout, feedback required;
#
#   - 1970 deg empty-close floor from the measured 1978.9 deg hard stop.
#
# This is a dedicated test profile.  The default bin/run_task_b profile remains
# unchanged and safe (dry_run=true, gripper.backend=mock).
task:
  mode: B
  max_picks: 1
  stop_on_error: true
  sample_period_s: 0.2
vision:
  backend: realsense_yolo
  weights: ../models/best.pt
  min_confidence: 0.35
  require_depth: true
  camera_frame_id: camera_color_optical_frame
  width: 640
  height: 480
  fps: 15
  serial: ''
  warmup_frames: 20
  # Match best.pt's recorded training size; 960 suppresses this model's boxes.
  imgsz: 640
  device: 0
  depth_window: 5
  target_class: 8-Plastic_Banana
  classes:
  - 1-Cheez-it
  - 2-Starkist_Tuna
  - 3-Scissors
  - 4-Frenchs_Mustard
  - 5-Tomato_Soup
  - 6-Foam_Brick
  - 7-Clamp
  - 8-Plastic_Banana
  - 9-Mug
  - 10-meat_can
  anchor: top_center
  rotate_180: true
  output_dir: ../logs/vision_banana_center_diagnostics
  continuous: false
  show: false
  window_name: Track 1 - D405 + YOLO
  preview_fps: 30
  capture_timeout_s: 20.0
  stale_after_s: 2.0
  stabilizer:
    enabled: true
    inference_min_confidence: 0.1
    confirm_hits: 3
    max_misses: 3
    match_iou: 0.2
    confidence_alpha: 0.25
    box_alpha: 0.55
    depth_alpha: 0.25
    duplicate_iou: 0.55
    containment_ratio: 0.9
    cross_class_iou: 0.4
    cross_class_containment: 0.6
    cross_class_conf_ratio: 1.5
    max_per_class: 1
    class_switch_hits: 3
    edge_margin_px: 8
    edge_suppress_confidence: 0.55
  save_annotated: true
  save_interval_s: 2.0
task_a:
  iou_threshold: 0.75
  ground_truth_file: ''
  output_dir: ../logs/task_a_annotated
  save_annotated: true
  draw_labels: true
  draw_ground_truth: true
  max_frames: 0
  min_positions: 10
  patrol:
    enabled: true
    position_count: 10
    min_move_distance_m: 0.15
    stride_m: 0.2
    linear_step_m: 0.01
    settle_s: 0.8
