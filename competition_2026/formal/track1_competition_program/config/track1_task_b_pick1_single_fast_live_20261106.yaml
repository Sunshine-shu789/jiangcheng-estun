    # whole-object PCA minor axis.  This mode fails closed without a target mask.
    waist_midline_enabled: true
    waist_midline_min_mask_points: 400
    waist_midline_min_path_px: 60.0
    waist_midline_tangent_window_px: 24.0
    waist_midline_min_tangent_linearity: 1.50
    waist_midline_depth_radius_px: 6
  arbitrary_placement: false
  tilted_visual_grasp: false
  require_validated_extrinsics: true
  min_pose_confidence: 0.5
  candidates:
