schema_version: 1
purpose: >-
  赛道一 40 类 v8 分类行重建：从已通过审计的 v5 best 特征重新训练第 17、26 类
  三个尺度分类行；禁止移植 v7 分类行。前 10 类、其他类别和其他网络参数保持冻结，
  数据集继续使用 v7 的仅训练集过采样版本，验证集保持原样。
