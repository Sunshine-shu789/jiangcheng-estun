# Stand-alone bring-up configuration for the vendor step_motor ROS node.
# This file never moves the robot arm.

task:
  mode: C
  max_picks: 1
  stop_on_error: false
  sample_period_s: 0.2

vision:
  backend: mock
  scenario_file: ../app/track1_grasp/scenarios/mock_track1_scene.yaml

motion:
  backend: mock
  dry_run: true

gripper:
  # The vendor motor_node owns /dev/motor_serial.  This backend must not open
  # the serial port itself.
  backend: ms42dc_ros
  motor_control_topic: /motor_control
  motor_state_topic: /motor_state
  device_id: 1
  subdivide: 32
  motion_mode: 2              # relative angle; message angle = degrees * 10
  open_dir: 0
  close_dir: 1
  open_angle_deg: 1957.9      # measured 2026-10-31: 5.44 turns
  close_angle_deg: 1957.9
  speed_rad_s: 5.0            # conservative bench/field speed
  status_timeout_s: 1.0
  motion_timeout_s: 15.0
  ros_connect_timeout_s: 5.0
  invert_direction: false     # set true if open really closes
  # During bring-up this deliberately fails instead of pretending a silent
  # controller has completed the motion.  Set false only for supervised
  # direction tests with no object between the fingers.
  require_feedback: true
  hold_min_angle_deg: 1950.0  # empty close 1978.5-1978.8 deg; validate with objects
  settle_time_s: 0.3
  open_before_approach: true
