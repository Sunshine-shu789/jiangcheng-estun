  epochs: 120
  imgsz: 640
  batch: 8
  device: 0
  workers: 2
  cache: false
  amp: true
  pretrained: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  patience: 30
  save: true
  save_period: 10
  val: true
  plots: true
  verbose: true
  seed: 42
  deterministic: true
  close_mosaic: 15
  mosaic: 0.30
  mixup: 0.0
  copy_paste: 0.0
  degrees: 10.0
  translate: 0.10
  scale: 0.35
  shear: 2.0
  perspective: 0.0005
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.45
  hsv_v: 0.30
  multi_scale: 0.0
  rect: false
  fraction: 1.0
  freeze: 0
  cls_pw: 0.5
holdout_eval:
