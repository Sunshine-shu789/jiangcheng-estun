schema_version: 1
title: '赛道一已有照片多物品 bbox 复核'
description: >-
  一张图允许多个类别和同类多个实例。采集类别只是提示，不是本图唯一标签。
  本程序不打开相机、不导入 ROS、不控制机器人。

paths:
  project_root: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序'
  source_root: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/datasets/track1_selfcollected_v3_no_scene_taxonomy'
  review_root: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/datasets/track1_postclasses_bbox_review_v1'
  export_root: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/datasets/track1_postclasses_bbox_export_v1'
  class_map: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/datasets/track1_selfcollected_v1/manifests/class_map.yaml'
  world_weights: '/media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/models/yolov8s-worldv2.pt'

candidate_generation:
  # 这些参数只生成“人工候选框”，不能直接作为训练标签。
  min_depth_m: 0.15
  max_depth_m: 1.50
  plane_threshold_m: 0.006
  object_min_height_m: 0.008
  object_max_height_m: 0.40
  depth_sample_step: 8
  ransac_iterations: 500
  ransac_seed: 20261028
  min_component_pixels: 80
  morph_kernel: 5
  keep_border_components: true
  world_conf: 0.01
  world_iou: 0.45
  world_imgsz: 640
  world_device: 'cpu'
  world_max_det: 100

# YOLO-World 只用于界面提示。所有类别都保留提示词，避免同框混入前 10 类时漏掉框选入口。
