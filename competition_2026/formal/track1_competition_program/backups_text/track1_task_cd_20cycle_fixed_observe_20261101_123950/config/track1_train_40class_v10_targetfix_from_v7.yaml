schema_version: 1
purpose: >-
  赛道一 40 类 v10 定点修正：从 v7 best 出发，只训练第 4、10、17、26 类的
  三尺度最终分类卷积行。针对 v7 中肉罐头被 Eggs_Plush/法式芥末酱抢占的问题，
  同时保留 v7 已获得的绿色蛋形毛绒玩具识别能力；其他 36 类分类行、主干、颈部、
  回归头和检测头其他参数全部冻结。验证集不参与训练，不增加任何新照片。
dataset_yaml: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/datasets/track1_training_merged_v9_hardneg/dataset.yaml
base_weights: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/runs/track1_train_40class_v7_rowfix/track1_40class_v7_rowfix_20261031_011500/weights/best.pt
output_root: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/runs/track1_train_40class_v10_targetfix_from_v7
preflight_report: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/reports/track1_training_preflight_v10_targetfix_latest.json
expected:
  nc: 40
  source_nc: 40
  empty_slots: []
  images:
    train: 812
    val: 121
  boxes: 1365
  review_records: 348
  reviewed_with_boxes: 346
  empty_review_records: 2
  skipped_review_records: 0
  postclass_boxes: 602
  min_free_gb: 5
  min_gpu_memory_gb: 6
  front10_names:
  - 1-Cheez-it
  - 2-Starkist_Tuna
  - 3-Scissors
  - 4-Frenchs_Mustard
  - 5-Tomato_Soup
  - 6-Foam_Brick
  - 7-Clamp
  - 8-Plastic_Banana
  - 9-Mug
  - 10-meat_can
  front10_images:
    train: 75
    val: 23
  front10_boxes: 143
  front10_review_records: 71
  front10_empty_records: 0
  front10_skipped_records: 0
  official_front10_images_used: false
  # Internal zero-based indices. The v10 gate directly covers both new classes.
  required_ap50:
    16: 0.50
    25: 0.50
  front10_ap50_min: 0.50
  max_front10_ap50_drop: 0.03
  front10_baseline_metrics: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/runs/track1_train_40class_v7_rowfix/track1_40class_v7_rowfix_20261031_011500/post_train_audit.json
  row_finetune_class_indices:
  - 3
  - 9
  - 16
  - 25
train:
  epochs: 30
  imgsz: 640
  batch: 8
  device: 0
  workers: 4
  cache: false
  amp: true
  pretrained: true
  optimizer: AdamW
  # Deliberately low LR: adapt four class rows to v7 features without erasing
  # the already verified v7 green-Eggs decision boundary.
  lr0: 0.0005
  lrf: 0.10
  momentum: 0.90
  weight_decay: 0.0
  warmup_epochs: 0.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.0005
  cos_lr: true
  patience: 12
  save: true
  save_period: 5
  val: true
  plots: true
  verbose: true
  seed: 42
  deterministic: true
  close_mosaic: 0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  degrees: 3.0
  translate: 0.05
  scale: 0.2
  shear: 1.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  multi_scale: 0.0
  rect: false
  fraction: 1.0
  freeze: 0
  cls_pw: 0.5
row_finetune:
  enabled: true
  class_indices:
  - 3
  - 9
  - 16
  - 25
  class_names:
  - 4-Frenchs_Mustard
  - 10-meat_can
  - 17-Eggs_Plush
  - 26-Plastic_Strawberry
  freeze_all_other_parameters: true
  mask_unselected_class_rows: true
  keep_batch_norm_eval: true
  require_zero_weight_decay: true
cpu_profile:
  batch: 2
  workers: 2
  amp: false
