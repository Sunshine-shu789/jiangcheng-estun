# Task B arbitrary-placement OFFLINE MOCK observations.
#
# The target geometry below is fixed in the robot base frame so every capture
# can be projected through the *current* flange pose and calibrated eye-in-hand
# transform.  This is essential after a tilted grasp: a static camera-frame XY
# would otherwise be reused with a different wrist orientation and move the
# same object underneath the table.
#
# These five deterministic poses are an offline regression scenario only.  The
# production planner never reads this file and never stores their coordinates;
# it always transforms the current camera observation through live robot state.
# A separate seeded random matrix exercises positions and headings beyond this
# fixed batch.
frames:
  - frame_id: arbitrary_round_1
    detections:
      # A high-confidence wrong class must be filtered out before selection.
      - label: 9-Metal_Screwdriver
        instance_id: arbitrary_decoy
        confidence: 0.99
        bbox: [40, 80, 180, 260]
        world_xyz: [-0.230000, 0.160000, -0.038478]
        world_major_axis: [1.0, 0.0, 0.0]
        world_minor_axis: [0.0, 1.0, 0.0]
        major_axis_length_m: 0.16
        minor_axis_length_m: 0.04
        pose_confidence: 0.99
        graspability: 1.0
        attributes: {held: false}

      - label: 8-Plastic_Banana
        instance_id: arbitrary_banana_round_1
        confidence: 0.95
        bbox: [220, 180, 360, 300]
        world_xyz: [0.124373, 0.420973, -0.038478]
