# Stand-alone gripper config for bench bring-up, before it is mounted.
#
#   python3 -m track1_grasp.tools.gripper_bench status --config config/ms42dc_gripper.example.yaml
#   python3 -m track1_grasp.tools.gripper_bench cycle  --config config/ms42dc_gripper.example.yaml --really
#
# Everything outside the `gripper:` block is only there because the shared
# config schema expects it; the bench tool never touches vision or motion.

task:
  mode: C
  max_picks: 1

vision:
  backend: mock
  scenario_file: ../scenarios/mock_track1_scene.yaml

motion:
  backend: mock
  dry_run: true

gripper:
  backend: ms42dc
  # Bind to the physical adapter rather than the enumeration-dependent ttyACM0.
  serial_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CF0022496-if00
  serial_baudrate: 115200
  device_id: 1
  subdivide: 32
  motion_mode: 2                # 2 = relative, 4 = absolute
  open_angle_deg: 1957.9        # measured 2026-10-31: 5.44 turns, 5.5-turn firmware
  close_angle_deg: 1957.9
  speed_rad_s: 5.0              # conservative bench/field speed
  status_timeout_s: 1.0
  motion_timeout_s: 15.0
  invert_direction: false       # set true if open actually closes
  hold_min_angle_deg: 1950.0    # empty close 1978.5-1978.8 deg; validate with objects
  require_feedback: true        # do not report a move as complete without 到位反馈
  settle_time_s: 0.3
