# 赛道一 C/D 正式抓取配置（V11 40 类，2026-11-01 固化）
# - V11 权重已复制到 models/official，并启用加载前 SHA256 校验。
# - 40 类顺序与 V11 模型完全一致，17-Eggs_Plush 和 26-Plastic_Strawberry 已启用。
# - 仅改变 Task C/D 默认模型链路；Task A/B 默认配置不变。
# - 安全默认仍为 motion.dry_run=true、gripper.backend=mock，不代表真机运动授权。
task:
  mode: C
  max_picks: 40
  stop_on_error: false
  sample_period_s: 0.2
# 固定观察位由现场当前姿态只读采集（30 个 RobotInfo 样本，无 RobotMove）。
# 清空模式仍保持关闭，直到固定放置位完成示教和现场验证。
