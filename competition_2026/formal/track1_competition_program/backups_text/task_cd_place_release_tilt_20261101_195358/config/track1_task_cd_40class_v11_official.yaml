pose:
  camera_frame: flange
  extrinsics_file: /media/sunshine/新加卷/埃斯顿比赛_2026/赛道一比赛程序/config/camera_to_flange.d405_calibrated_20261025.yaml
  use_detection_base_xyz: false
  fallback_camera_to_base: false
  # 控制器 RobotInfo/RobotMove 使用法兰坐标；不能与 TCP 坐标混用。
  robot_pose_frame: flange
  # 从法兰原点到闭合夹爪最低尖端的偏移，单位为米。
  # 0.165 m 来自现场装配标定，不是 MS42DC 官方成品尺寸。
  gripper_tip_offset_flange_m: [0.0, 0.0, 0.165]
motion:
  backend: robotmove
  dry_run: true
  motion_mode: joint_ik
  workspace_min:
  - -0.65
  - -0.65
  - 0.02
  workspace_max:
  - 0.65
  - 0.65
  - 0.8
  workspace_margin: 0.01
  approach_height: 0.08
  grasp_z_offset: 0.0
  lift_height: 0.1
  # C/D release target is the closed-jaw low point, not the controller flange.
  # Planner converts jaw-tip XYZ to flange XYZ with the configured tool offset.
  place_pose_frame: jaw_tip
  place_pose:
  - 0.25
  - 0.25
  - 0.08
  - 3.14159265
  - 0.0
  - 0.0
  place_approach_height: 0.08
  retreat_height: 0.08
  speed_mps: 0.01
  orientation: fixed
  fixed_rpy:
  - 3.14159265
  - 0.0
  - 0.0
  # C/D 抓取必须使用显式固定姿态；visual 目标点按夹爪尖解释。
  grasp_rpy: [3.14159265, 0.0, 0.0]
  grasp_safety:
    enabled: true
    require_flange_tip_offset: true
    require_tool_down: true
    maximum_tool_tilt_deg: 2.0
    minimum_approach_height_m: 0.05
    maximum_approach_height_m: 0.12
    maximum_approach_xy_error_m: 0.001
    # 0.0 只是禁止夹爪尖低于基座 Z=0 的临时下限，不是桌面高度标定值。
    # 其余 null 表示现场安全包络尚未标定；live 会因缺少任一限值失败关闭。
    minimum_grasp_flange_z_m: null
    maximum_grasp_flange_z_m: null
    minimum_grasp_tip_z_m: 0.0
    maximum_grasp_tip_z_m: null
    minimum_route_flange_z_m: null
    maximum_route_flange_z_m: null
    minimum_route_tip_z_m: 0.0
    maximum_route_tip_z_m: null
    maximum_horizontal_reach_m: null
  move_timeout_s: 30.0
  position_tolerance_m: 0.003
  poll_period_s: 0.05
  robotmove_topic: RobotMove
  robotinfo_topic: RobotInfo
  robot_info_timeout_s: 2.0
  joint_max_step_deg: 1.0
  joint_tolerance_deg: 0.35
  joint_start_tolerance_deg: 0.05
  joint_limit_margin_deg: 2.0
  joint_move_timeout_s: 8.0
  joint_reject_timeout_s: 2.0
  cartesian_step_m: 0.002
  cartesian_min_step_m: 0.0005
  cartesian_orientation_step_deg: 1.0
