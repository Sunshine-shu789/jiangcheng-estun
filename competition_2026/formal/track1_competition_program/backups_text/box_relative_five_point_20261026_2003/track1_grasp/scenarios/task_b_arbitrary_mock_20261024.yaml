# Task B arbitrary-placement OFFLINE MOCK observations.
#
# Each frame is a fresh camera observation.  The mock arm remains at the
# previous round's retreat pose, so camera_xyz below expresses the next object
# relative to that current flange pose.  No frame is derived from the legacy
# five-point coordinates or from a previously released XY.
#
# The five objects intentionally vary in position and tabletop yaw, including
# non-zero principal-axis Z components.  Grasp planning uses only the current
# object centre and PCA axis from that frame.  Camera depths are chosen for a
# fixed tabletop: round 1 starts with flange Z=0.300 m, then the in-place
# pick/return retreat remains near flange Z=0.247 m.  The observed object
# centre therefore remains near base Z=0.002 m rather than climbing with the
# mock arm.  With the corrected 165 mm flange-to-jaw-tip offset this keeps the
# five synthetic observations physically consistent.
frames:
  - frame_id: arbitrary_round_1
    detections:
      # A high-confidence wrong class must be filtered out before selection.
      - label: 9-Metal_Screwdriver
        instance_id: arbitrary_decoy
        confidence: 0.99
        bbox: [40, 80, 180, 260]
        depth_m: 0.298
        camera_xyz: [-0.240, -0.110, 0.298]
        object_center_camera_xyz: [-0.240, -0.110, 0.298]
        major_axis_camera: [0.0, 1.0, 0.0]
        minor_axis_camera: [1.0, 0.0, 0.0]
        major_axis_length_m: 0.16
        minor_axis_length_m: 0.04
        pose_confidence: 0.99
        graspability: 1.0
        attributes: {held: false}

      - label: 8-Plastic_Banana
        instance_id: arbitrary_banana_round_1
        confidence: 0.95
        bbox: [220, 180, 360, 300]
        depth_m: 0.298
        camera_xyz: [0.120, -0.365, 0.298]
