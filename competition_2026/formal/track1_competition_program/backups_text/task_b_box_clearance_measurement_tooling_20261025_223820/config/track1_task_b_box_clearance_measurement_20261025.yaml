# Task B physical box-clearance measurement record.
#
# ACTIVE FIELD RECORD (DRAFT).  Empty/null values and false review flags are
# intentional blockers.  Fill every field from an on-site static measurement,
# save the evidence files, and run bin/check_task_b_box_clearance_measurement.
#
# Units are metres and radians.  Box-local origin is the midpoint of the inner
# rectangle.  Box-local +X points from the west inner wall toward the east
# inner wall; box-local +Y points from the south inner wall toward the north
# inner wall.  yaw_rad is the base-frame angle from base +X to box-local +X,
# positive counter-clockwise.
schema_version: 1
status: draft

metadata:
  project: ESTUN_2026_TRACK1_TASK_B
  measured_at: ''                 # ISO-8601 with timezone
  measured_by: ''
  reviewed_by: ''
  measurement_location: ''
  controller_base_frame: ''       # Exact frame used for all box coordinates
  instrument_id: ''
  measurement_method: ''
  uncertainty_m: null             # Positive measured/estimated uncertainty
  yaw_uncertainty_rad: null       # Positive measured/estimated uncertainty
  bin_identifier: ''

box:
  center_xy_m: [null, null]
  yaw_rad: null
  interior_size_m: [null, null]   # [east-west full width, north-south depth]

# Positive values are additional exclusion margins applied inside the measured
# wall/obstacle boundaries.  Select them from measurement uncertainty and the
# mechanical safety review; do not enter zero merely to pass the checker.
clearances:
  wall_m: null
  obstacle_m: null

gripper_footprint:
  source_description: ''          # Physical assembly / CAD revision / measurement
  flange_xy_m: []                 # Convex points, ordered around the perimeter

# Inventory every structure that could overlap the descending gripper footprint.
# Each L-shaped corner MUST be split into multiple strictly convex polygons.
# Replace placeholder vertices and add as many convex pieces as the real shape
# requires.  Keep at least eight lower_corner pieces and two edge_boss pieces.
