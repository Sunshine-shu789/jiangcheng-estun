# Task B reference pick-point windows (example values only).
#
# IMPORTANT: these coordinates are placeholders and must be replaced with the
# five calibrated pick points for the actual competition cell.  They are used
# only to decide whether a visual detection is close enough to the expected
# point before any motion is commanded.  The release pose is not taken from
# this file: after a successful grasp the object is returned to the observed
# grasp XY, so each object goes back exactly where it was picked.
#
# Every pose is [x, y, z, rx, ry, rz] in the ROBOT BASE frame: metres for xyz,
# radians for the rpy triple.  The five XY points must be distinguishable:
# return_to_pick relies on the observed release XY to reject an object left at
# an already completed point.
places:
  - name: pick_1
    # Calibrated 2026-10-19 from /RobotInfo after the operator positioned the
    # TCP about 20 cm above the real point-1 banana.  Z is the measured
    # observation Z minus search.observation_clearance_m (0.20 m).
    pose: [-0.068909, 0.514367, 0.110603, -3.089440, 0.066004, -0.086835]
  - name: pick_2
    # Calibrated 2026-10-20 from a stable 25-frame /RobotInfo capture after
    # the operator manually moved the TCP to the safe point-2 observation
    # pose. The visual check confirmed the banana at 0.224 m with confidence
    # 0.912. Reference Z is observation TCP Z minus the configured 0.20 m.
    pose: [-0.148975635, 0.515201218, 0.054104717, 3.139195728, 0.032036279, 0.068747293]
  - name: pick_3
    # Calibrated 2026-10-20 from a stable 25-frame /RobotInfo capture after
    # the operator manually moved the TCP to the point-3 observation pose.
    # The live view confirmed the banana at 0.232 m with confidence 0.947.
    # Reference Z is observation TCP Z minus the configured 0.20 m.
    pose: [-0.141483455, 0.453537901, 0.069567695,
           3.040665917, 0.038556504, 0.177139360]
  - name: pick_4
    pose: [-0.30, -0.30, 0.08, 3.14159265, 0.0, 0.0]
  - name: pick_5
    pose: [0.00, 0.00, 0.08, 3.14159265, 0.0, 0.0]
