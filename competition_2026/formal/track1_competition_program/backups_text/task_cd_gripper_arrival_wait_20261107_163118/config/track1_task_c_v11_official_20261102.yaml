gripper:
  backend: ms42dc
  serial_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CF0022496-if00
  serial_baudrate: 115200
  device_id: 1
  subdivide: 32
  motion_mode: 2
  open_angle_deg: 1957.9
  close_angle_deg: 1957.9
  # 2026-11-02 实机复盘：2.0 rad/s 闭爪只用 0.28 s 就误报到位，
  # 累计行程仅 205.7 deg，爪指尚未夹住物体。4.0 rad/s 已在空载台架
  # 验证可走完全行程；行程证据不足时仍会 fail-closed，禁止抬臂。
  speed_rad_s: 5.0
