# 赛道一 任务C 正式抓取配置（V11 40 类已知物体）
# - C/D 共享入口：bin/run_task_cd C
# - 与任务D共用同一抓取程序、runner、几何和安全逻辑；仅模式策略不同。
# - 只允许 target.known_classes 中的 40 个已知类别；unknown/object 一律拒绝。
# - V11 权重已复制到 models/official，并启用加载前 SHA256 校验。
# - 40 类顺序与 V11 模型完全一致，17-Eggs_Plush 和 26-Plastic_Strawberry 已启用。
# - 本文件只服务任务C，不用于任务D；Task A/B 默认配置不变。
# - 2026-11-01 已获操作员明确实机运动授权，并完成固定观察/放置位、最低
#   抓取位、相机测距和 MS42DC 夹爪连接检查。启动仍须经过显式真机确认。
task:
  mode: C
  # 兼容字段，仅为旧工具链保留。Task C/D 的 task_cd 清箱流程忽略此值。
  # 每次普通抓取前在固定视角有限重拍并在看到候选后立即规划；未到周期性
  # 清空检查时，无候选绝不换位扫描、绝不判空。每成功抓取 20 次后的下一轮
  # 才做完整清空确认。
  max_picks: 40
  stop_on_error: false
  sample_period_s: 0.2
# 固定观察位由现场当前姿态只读采集（30 个 RobotInfo 样本，无 RobotMove）。
# 固定放置位由现场当前姿态只读采集；操作员确认保持约 17 度倾斜释放。
task_cd:
  # 2026-11-05 现场诊断：固定观察位下的盒中心/内框几何与实际物品位置不一致，
  # 旧实现又把完整夹爪包络按同一低高度检查，导致盒内正常目标在只读预检阶段
  # 被误拒绝（香蕉、适配器、橡皮鸭、夹子）。按现场授权暂时关闭整个
  # Task C/D 盒壁/盒边门禁；几何与 15 mm 参数保留，便于以后恢复。
  # required=false 同时停用盒边平行姿态强制和盒内外完整包络检查。
  # 其它 IK、关节限位、碰撞、CAD 开口、奇异值和工作空间门禁继续生效。
  box_clearance:
    required: false
    geometry_validated: true
    geometry_source: field_measured
    center_xy_m: [-0.045, 0.530]
    yaw_rad: 0.0
    interior_size_m: [0.350, 0.200]
    wall_clearance_m: 0.015
    obstacle_clearance_m: 0.0
    edge_align_band_m: 0.050
    edge_parallel_required: true
    wall_top_z_m: 0.120
    gripper_footprint_flange_xy_m:
    - [-0.031507, -0.058971]
    - [0.031507, -0.058971]
    - [0.031507, 0.058971]
    - [-0.031507, 0.058971]
    obstacles_m: []
  enabled: true
  # startup_direct_grasp 仅保留兼容旧配置；当前运行逻辑不再依赖它区分
  # 首轮/后续：每次普通抓取都从固定位开始，看到候选立即进入完整安全预检。
  # 固定位无候选仅允许有限重拍，不能换位扫描，也不能报告空箱。
  startup_direct_grasp: true
  # 每完成 20 次完整搬运（转移、释放、最终退避均成功）后的下一轮，
  # 才执行一次固定位加全部换位视角的完整清空确认。
  empty_check_interval_successes: 20
  # 固定位单轮最多 3 次拍摄；第 1 帧看到候选就立即规划，不等待后续帧。
  # 3 次均无候选时本轮安全阻塞，空箱状态仍未证明。
  fixed_view_miss_retry_frames: 3
  # 2026-11-05 实机：同一批不可执行目标被安全门禁稳定拒绝后，禁止快速空转
  # 或把“未清空”误当成程序结束。连续 3 个固定位观察周期无新可执行候选时，
  # 进入不结束程序的安全阻塞等待；每 5 秒仅在固定位重新观察，不打空抓、
  # 不换位扫描、不判空箱。操作员更换/补充物品后，出现可执行候选即自动继续。
  fixed_view_no_progress_cycles: 3
  blocked_retry_period_s: 5.0
  observation_pose_file: task_cd_observation_pose_20261101_194651.yaml
  observation_pose_tolerance_deg: 0.5
  return_to_observation_after_each_pick: true
  place_pose_verified: true
  exclude_completed_tracks: true
  # 2026-11-03：YOLO 曾把夹爪本体识别为 10-meat_can。以下包络使用本帧捕获
  # 的 flange->camera 与 flange->body 变换同时检查检测单点和点云中心；落在
  # 夹爪本体包络内的结果在目标策略、预检、张爪和 Cartesian 运动之前剔除。
  gripper_self_filter:
    enabled: true
    flange_to_body_xyz: [0.0, 0.0, 0.091751924]
    flange_to_body_rpy: [0.0, -1.5707963267949, 0.0]
    body_envelope_min: [-0.142, -0.109, -0.082]
    body_envelope_max: [0.136, 0.109, 0.082]
  # 收纳盒换位后不再要求人工重教固定观察位。换位视角只允许用于成功数
  # 达到 20 的倍数后的周期完整清空确认，普通抓取轮绝不换位扫描。
  relocation_scan:
    enabled: true
    # 2026-11-04 操作员要求恢复固定观察位作为唯一任务起点：进入固定观察位后
    # 直接观察，不再先向前伸 0.11 m。固定视角一旦确认可抓物品，就立即进入
    # 完整安全预检和抓取；放置位保持原标定坐标不变。
    fast_forward_enabled: false
    fast_forward_offset_xyz_m: [0.0, 0.11, 0.0]
    fast_forward_settle_s: 0.2
    fast_forward_observe_frames: 1
    fast_forward_confirm_hits: 1
    # 固定观察位每轮最多有限重拍，看到可抓候选立即规划；完整视角仅用于
    # 每 20 次成功后的周期清空确认。
    complete_box_before_planning: false
    # 完整覆盖收纳盒：四向、四角和高位复查。每轮都必须完成固定位与
    # 全部换位视角，任一视角失败都会中止且不会报告空箱。
    # 2026-11-03 现场固定姿态只读预检：原 +Y 0.12 m 低于奇异值门限；
    # 保持 0.01 门限不变，将 +Y 轴收到 0.11 m、正 Y 角点收到 0.075 m。
    offsets_xyz_m:
      - [-0.12, 0.0, 0.0]
      - [0.12, 0.0, 0.0]
      - [0.0, -0.12, 0.0]
      - [0.0, 0.11, 0.0]
      - [-0.085, -0.085, 0.0]
      - [0.085, -0.085, 0.0]
      - [-0.085, 0.075, 0.0]
      - [0.085, 0.075, 0.0]
      - [0.0, 0.0, 0.08]
    settle_s: 0.15
  # 普通空箱不是“一个视角没看到目标”。必须连续完成两轮整箱扫描，全部视角
  # 成功、无任何物理物品证据，才允许 NO_TARGET。四角小物品同样是真实物品，
  # 必须继续尝试抓取或在安全等待中重试，绝不能作为空箱证据。
  empty_confirmation:
    enabled: true
    require_complete_full_scan: true
    confirmation_rounds: 2
    require_all_views_successful: true
    reject_if_any_item_present: true
  # 所有物品的夹爪闭合轴对齐 PCA 短轴，夹爪跨短边闭合。2026-11-02 实机失败复盘确认：
  # 当前夹爪安装时钟约为 90°，实际张合轴对应工具 +X，而非 CAD 标称 +Y。
  # 这里显式配置实际闭合轴，禁止继续按未经验证的安装方向猜测。
  # PCA、置信度或水平投影任一无效时该候选被跳过，不张爪、不预检、不运动。
  short_edge_grasp:
    enabled: true
    closure_axis_tool_xy: [1.0, 0.0]
    geometry_policy:
      enabled: true
      allow_rim: true
      allow_vertical_center: true
      allow_horizontal_sidewall: false
    # 垂直候选完整预检失败后，再尝试沿工具 Z 的有界倾斜接近；
    # 正负对称倾角覆盖腕部分支差异，且任一候选仍须通过完整安全预检。
    tilt_angles_deg: [15.0, -15.0, 30.0, -30.0]
    tool_axis_approach_height_m: 0.08
    # 每个几何抓取点最多做 5 个朝向的完整预检；中心点的 5 个变体失败后仍会
    # 进入长轴端部兜底点，而不是无限尝试全部倾斜组合。
    max_precheck_attempts_per_point: 5
    # 先抓点云几何中心，保证夹爪落在物体中间，而不是 YOLO 的单像素检测锚点。
    # 仅对下列带柄/长端物品，在中心候选的完整 IK、路由和安全预检失败后，
    # 再尝试 PCA 长轴两端 ±30% 长轴长度的端部候选。端部是几何兜底点，
    # 不是模型识别到的语义柄关键点；每个候选仍必须通过全部只读预检才会运动。
    grasp_point_modes: [object_center, handle]
    handle_grasp_labels:
      - 3-Scissors
      - 4-Frenchs_Mustard
      - 7-Clamp
      - 9-Mug
      - 24-Spoon
      - 25-Flat_Screwdriver
      - 30-Stabilo_OHPen
      - 36-Adjustable_Wrench
    handle_offset_fraction: 0.30
    min_pose_confidence: 0.50
    require_validated_extrinsics: true
    # 2026-11-07：固定 jaw_tip_z=0.000103 m 在 ICRA_Duckie 上比同帧支撑面
    # 低约 12.7 mm，实际会抓得过低。改为使用同帧支撑面、支撑法向和可见物体
    # 高度重建顶面，在顶面下方按目标高度比例选择夹爪尖 Z；主候选取 50%，
    # 即夹爪尖靠近物体腰线。高度证据缺失、顶面与高度不一致或无法同时满足
    # 支撑面最小间隙时，该候选直接拒绝，不张爪、不运动、不静默回退固定 Z。
    height_adaptive_enabled: true
    height_target_insertion_fraction: 0.50
    height_min_insertion_fraction: 0.30
    height_max_insertion_fraction: 0.75
    height_min_support_clearance_m: 0.003
    height_top_surface_tolerance_m: 0.008
    height_min_visible_height_m: 0.008
    pca:
      min_valid_points: 200
      min_depth_m: 0.08
      max_depth_m: 1.20
      trim_percentile: 5.0
      # 圆形容器或矩形物体是否适合抓取由同帧几何策略决定；PCA 阶段先保留
      # 轴向证据，不能在候选生成前用旧阈值误拒绝可测量的杯沿。
      defer_axis_ratio_rejection: true
      # 现场俯视点云受遮挡影响会低估长宽比；1.02 仅作为数值可辨识下限，
      # 点数、置信度和水平投影无效时仍立即拒绝，不发力。
      min_axis_ratio: 1.02
      support_plane_required: false
      # 2026-11-05 现场诊断：固定相机约 16 度俯视时，严格桌面采样 ROI
      # 过窄，且重复检测框会遮蔽有效桌面像素。扩大采样范围但保留原有
      # 法向阈值、300 点下限、RMS/内点率、组件共识、目标间隙和质量门限。
      support_plane_scene_margin_x_px: 35
      support_plane_scene_margin_y_px: 45
      support_plane_min_local_normal_z: 0.99
      support_plane_roi_far_min_local_normal_z: 0.97
      support_plane_roi_far_depth_quantile: 0.80
      support_plane_component_min_inlier_ratio: 0.70
      support_plane_min_support_components: 5
vision:
  # 自适应中心优先：不设置固定“中间/四角”范围。每帧按目标相对分布
  # 连续排序，越接近画面中心的越先抓；外围大物品和小物品都照常进入抓取
  # 流程。该过滤只降低外围小物品的排序优先级，不构成空箱证据；只要还能
  # 看到任何盒角物品，程序就必须继续尝试或安全等待。
  corner_small_object_filter:
    enabled: true
    mode: adaptive
  backend: realsense_yolo
