  # 2026-11-02 C/D 操作目标：抬升后 D405 光学中心到收纳盒底部的直线距离
  # 为 0.35 m。最低抓取位实测该距离为 0.179600 m；相机光轴接近竖直，
  # 按同一姿态沿法兰 Z 上升 0.1706 m 后，该距离约为 0.3500 m。
  # 因此这里不是垂直抬升 0.35 m；完整路径仍由既有 Z 安全包络约束。
  lift_height: 0.1706
  # C/D release target is the closed-jaw low point, not the controller flange.
  # Planner converts jaw-tip XYZ to flange XYZ with the configured tool offset.
  place_pose_frame: jaw_tip
  # 2026-11-01 19:50 现场只读采集；操作员确认当前倾斜姿态就是释放姿态。
  # XYZ 是闭合夹爪尖，姿态与控制器法兰 RPY 一致。
  place_pose:
  - 0.270377682201
  - 0.335654065085
  - 0.246477463808
  - -2.84530955462
  - 0.015450189026
  - -0.92808733871
  place_approach_height: 0.08
  retreat_height: 0.08
  # 2026-11-04 吞吐测试：相对最近实跑 75% 档的
  # 0.0675 m/s 提高到 0.18 m/s，约 2.67 倍；视觉伺服速度独立保持。
  speed_mps: 0.18
  # 标量关节速度上限同步提高到 2.4 rad/s。J1-J3 的 URDF 上限为
  # 2.617994 rad/s，因此实际命令仍保留约 8.3% 的模型余量。
  joint_speed_rad_s: 2.4
  joint_speed_safety_limit_rad_s: 2.4
  orientation: fixed
  fixed_rpy:
  - 3.14159265
  - 0.0
  - 0.0
  # C/D 抓取必须使用显式固定姿态；visual 目标点按夹爪尖解释。
  grasp_rpy: [3.14159265, 0.0, 0.0]
  grasp_safety:
    enabled: true
    require_flange_tip_offset: true
    require_tool_down: true
    # 抓取和抬升工具轴倾角受有界安全上限限制；放置段单独允许现场确认的倾斜姿态。
    maximum_tool_tilt_deg: 30.0
    maximum_place_tool_tilt_deg: 18.0
    minimum_approach_height_m: 0.05
    maximum_approach_height_m: 0.12
    maximum_approach_xy_error_m: 0.001
    # 2026-11-01 22:18 现场同步标定：操作员确认这是收纳盒内整个水平范围
    # 都可安全到达的最低抓取高度。30 帧稳定 /RobotInfo 的夹爪尖实测 Z 为
    # 0.000103 m；同一静止状态下 D405 到空盒底部深度中值为 0.179600 m。
    minimum_grasp_flange_z_m: 0.164621
    minimum_grasp_tip_z_m: 0.000103
    minimum_route_flange_z_m: 0.164621
    minimum_route_tip_z_m: 0.000103
    # 2026-11-01 操作员明确要求：不设置“最高抓取点位”。这两个上限保持
    # null；live 仍强制最低边界、路线包络、工具倾角、接近高度和机器人
    # 关节/工作空间预检查。不得把当前临时姿态或推测值写成抓取上限。
    maximum_grasp_flange_z_m: null
    maximum_grasp_tip_z_m: null
    # 以下值不是新示教点，而是由已确认的固定放置位和固定 8 cm 接近量推导：
    # flange 0.404269299444 + 0.080000000000 = 0.484269299444 m；
    # jaw-tip 0.246477463808 + 0.080000000000 = 0.326477463808 m。
    maximum_route_flange_z_m: 0.4842692994444904
    maximum_route_tip_z_m: 0.326477463808
    # 扩大 Task C 的软件水平包络。该值不再把过去单个最低抓取姿态的
    # 0.5846 m 当作整台六轴机械臂的全部工作区；实际可达性仍由逐点 IK、
    # 关节限位、分支跳变、奇异值和完整路线预检共同约束。
    maximum_horizontal_reach_m: 0.82
  move_timeout_s: 30.0
  position_tolerance_m: 0.003
  poll_period_s: 0.05
  robotmove_topic: RobotMove
  robotinfo_topic: RobotInfo
  robot_info_timeout_s: 2.0
  joint_max_step_deg: 1.0
  joint_tolerance_deg: 0.35
  joint_start_tolerance_deg: 0.05
  joint_limit_margin_deg: 2.0
  joint_move_timeout_s: 8.0
  joint_reject_timeout_s: 2.0
  cartesian_step_m: 0.002
  # 2026-11-02 只读预检：0.623° 在 0.5 mm 最小间距仍超过 0.6°；
  # 0.25 mm 只提高路径分辨率，不改变 0.6° 步长、5° 分支跳变、
  # 奇异值或 0.25° 离散加速度安全门禁。
  cartesian_min_step_m: 0.00025
  cartesian_orientation_step_deg: 1.0
  cartesian_min_orientation_step_deg: 0.1
  # 600 是单个内部规划块上限；长逻辑段可重叠分块，但整段仍受硬上限约束。
  cartesian_max_waypoints: 600
  cartesian_max_total_waypoints: 3200
  # 2026-11-01 现场短边姿态预检：0.517°/0.520° 被 0.500° 误拒绝；
  # 0.600° 仍低于控制器 joint_max_step_deg=1.000°，且加速度保护不变。
  cartesian_joint_step_deg: 0.6
  cartesian_joint_branch_jump_deg: 5.0
  cartesian_joint_acceleration_limit_deg: 0.25
  cartesian_min_jacobian_singular_value: 0.01
  # 完整安全预检仍逐点执行；真正下发给控制器的轨迹只保留有界抽稀点，
  # 首末点不变，相邻关节步长不超过 0.95°，跳过点的弦偏差不超过 0.15°。
  trajectory_compression_enabled: true
  trajectory_compression_max_joint_step_deg: 0.95
  trajectory_compression_max_chord_deviation_deg: 0.15
