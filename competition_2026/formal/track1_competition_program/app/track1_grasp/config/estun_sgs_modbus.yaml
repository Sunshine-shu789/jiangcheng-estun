# ESTUN SGS / S3-60-G2 Modbus TCP register baseline
#
# This file is intentionally read-only by default. The write addresses are
# documented, but no picking pipeline may use them until a supervised field
# write test has confirmed the live firmware behaviour.
schema_version: 1
controller:
  family: ESTUN SGS
  robot: S3-60-G2
  communication_port: LAN3(Modbus)
transport:
  protocol: modbus_tcp
  host: 192.168.101.100
  port: 502
  unit_id: 1
  byte_order: big_endian
  register_bits: 16
  supported_functions: [1, 3, 5, 6]
safety:
  read_only_default: true
  transport_writes_enabled: false
  robot_command_writes_enabled: false
  command_semantics: rising_edge_then_zero
  write_verification: required
registers:
  major_version: {address: 0x0000, access: ro}
  minor_version: {address: 0x0001, access: ro}
  move_rate: {address: 0x0008, access: ro}
  robot_mode: {address: 0x000E, access: ro}
  robot_safety_mode: {address: 0x000F, access: ro}
  robot_status: {address: 0x0010, access: ro}
  robot_command: {address: 0x0100, access: rw}
  move_rate_command: {address: 0x0103, access: rw}
  board_do: {address: 0x1002, access: ro}
  tool_do: {address: 0x1003, access: ro}
  board_do_command: {address: 0x1300, access: rw}
  board_do_mask: {address: 0x1301, access: rw}
  tool_do_command: {address: 0x1302, access: rw}
  tool_do_mask: {address: 0x1303, access: rw}
commands:
  0: NONE
  1: START_PROGRAM
  2: STOP_PROGRAM
  3: PAUSE_PROGRAM
  4: CONTINUE_PROGRAM
  5: SWITCH_ON
  6: SWITCH_OFF
  7: RESET_ERROR
  8: TO_AUTO
  9: TO_MANUAL
  10: SET_MOVE_RATE
status_bits:
  0: emergency_stop
  1: powered
  2: drag_mode
  3: moving
  8: simulation
  9-10: program_state
  15: fault
program_state:
  "00": stopped
  "10": running
  "01": paused_unconfirmed
  "11": reserved
address_evidence:
  holding_register_table:
    result: authoritative_baseline
    evidence: "Excel holding-register map; FC03 addresses remained stable in controller logs."
  pdf_chapter_10_offsets:
    result: not_absolute_modbus_register_addresses
    evidence: "Offsets 16/17/18 refer to the generic field layout; they conflict with the Excel map."
  controller_readonly_logs:
    paths:
      - "/media/sunshine/新加卷/埃斯顿比赛_2026/s3_60_pro_control/logs/modbus-2026-09-24T10-02-22.395Z.jsonl"
      - "/media/sunshine/新加卷/埃斯顿比赛_2026/s3_60_pro_control/logs/modbus-2026-10-08T11-16-04.054Z.jsonl"
    observed:
      major_version: 1
      minor_versions_seen: [6]
      robot_mode_addresses_seen_nonzero: [0x000E, 0x000F]
      board_do_address: 0x1002
task_handshake:
  status: not_assigned
  warning: "No application register addresses may be invented. Assign them in the controller project and verify with read-only tests first."
  required_fields:
    - request_sequence
    - program_id
    - target_pose_or_program_arguments
    - request_latch
    - controller_ack_sequence
    - controller_state
    - progress
    - fault_code
    - heartbeat
