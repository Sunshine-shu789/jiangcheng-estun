# Scripted observations used until the camera is mounted.  Each frame behaves
# like one camera/detector result.  base_xyz is only for this mock scene; real
# deployments use camera_xyz and camera-to-base calibration.
frames:
  - frame_id: mock_00_known_mug
    detections:
      - label: mug
        instance_id: mug_1
        confidence: 0.96
        bbox: [120, 90, 230, 240]
        depth_m: 0.41
        camera_xyz: [-0.08, -0.12, 0.41]
        base_xyz: [-0.16, -0.10, 0.035]
        graspability: 1.0
  - frame_id: mock_01_unseen_object
    detections:
      - label: object
        instance_id: unseen_1
        confidence: 0.82
        bbox: [250, 100, 365, 245]
        depth_m: 0.39
        camera_xyz: [0.00, -0.10, 0.39]
        base_xyz: [0.02, -0.08, 0.035]
