    pose: [0.30, -0.30, 0.08, 3.14159265, 0.0, 0.0]
  - name: corner_front_right
    pose: [0.30, 0.30, 0.08, 3.14159265, 0.0, 0.0]
  - name: corner_back_right
    pose: [-0.30, 0.30, 0.08, 3.14159265, 0.0, 0.0]
  - name: corner_back_left
    pose: [-0.30, -0.30, 0.08, 3.14159265, 0.0, 0.0]
  - name: centre
    pose: [0.00, 0.00, 0.08, 3.14159265, 0.0, 0.0]
